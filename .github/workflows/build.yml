name: Build

# The Kei node's own build. Replaces the inherited Banano workflows, which
# built `nanocurrency/nano-node` artifacts and pushed images to the
# `bananocoin` DockerHub namespace — neither of which is this project.
#
# This exists as much for development as for CI: the machine kei-node is
# written on has no working C++ toolchain and no administrator rights, so
# until one exists locally, this workflow is where the node actually compiles.
# See docs/decisions-m2.md §3.

# Every branch, not just master: with no local toolchain this workflow is the
# only place the tree compiles, so a branch that cannot reach it cannot be
# worked on at all.
on:
  push:
  pull_request:
  workflow_dispatch:

# A branch only needs its newest commit built. Without this, a run of quick
# fixes queues a full build each, and the answer to the one that matters
# arrives last.
#
# Master is the exception, and cancelling there cost this project dearly. With
# `cancel-in-progress: true` applied everywhere, each merge killed the previous
# master build: the runs for #42, #43, #48, #44, #49 and #66 all concluded
# `cancelled`, and a cancelled run reports no failure. That is how four red
# `asset_ledger` rollback tests reached master unseen and stayed there, and why
# every master tick over that stretch was worthless. `gh run watch` exits 0 on
# cancellation as well, so nothing anywhere said no.
#
# A master build must be allowed to finish and answer, however many merges land
# behind it. Branch builds keep the behaviour the paragraph above describes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  linux:
    name: Linux (gcc, lmdb, dev network)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # Boost is vendored at submodules/boost as the Boost superproject,
          # so this is a large recursive checkout and not an optional one:
          # CMakeLists.txt add_subdirectory()s each Boost library directly.
          submodules: recursive

      - name: Test the public RPC gateway boundary
        run: python3 -m unittest ops/testnet/test_rpc_gateway.py

      # The M2, M4 and M5 contracts live in the SDK repository. Pinning the revision
      # makes a green node build a claim about one reviewable contract, not whatever
      # happened to be at the tip of another repository when the job started.
      #
      # Moved from dcfa82d4 to 9ac5d85. The old pin predated M5's SDK tests
      # entirely, so run-m5.sh below had nothing to run against it. The new one is
      # the first revision carrying packages/kei/test/market-over-http.test.ts
      # *including* its ledger-lock case (kei-transaction#24), which is the one
      # assertion in that file the mock cannot fake.
      - name: Check out the pinned SDK contract
        uses: actions/checkout@v4
        with:
          repository: keicoin-org/kei-transaction
          ref: 9ac5d85b4cffd6dd33f3fad32ce177d76c6565d0
          path: kei-transaction

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install SDK dependencies
        working-directory: kei-transaction
        run: bun install --frozen-lockfile

      # This is a pure hash comparison against the pinned SDK source — no
      # node build or running instance needed — so it runs first and fails
      # fast, before ~40 minutes of Boost/RocksDB compilation, if the M4 claim
      # hashing on either side of the contract has drifted. See
      # conformance/generate-claim-vectors.ts for what this actually checks
      # and why it exists.
      - name: Check M4 claim vectors against the frozen SDK
        env:
          KEI_SDK_DIR: ${{ github.workspace }}/kei-transaction
        run: bun run conformance/generate-claim-vectors.ts --check

      # gcc-12 rather than whatever ubuntu-latest ships. RocksDB 7.8.3 is
      # vendored at submodules/rocksdb and predates GCC 13's removal of the
      # transitive <cstdint> include, so on a current image it fails with
      # "'uint32_t' was not declared in this scope" — in the submodule, with
      # nothing to do with this tree. Pinning the compiler is a smaller change
      # than pinning the whole runner image, and it fails visibly if gcc-12
      # ever stops being available.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache gcc-12 g++-12 gdb

      # Vendored Boost and RocksDB dominate the build, and neither changes
      # between runs, so without this every iteration recompiles both from
      # scratch. This is the difference between a ~40 minute loop and a ~5
      # minute one, which matters a great deal when CI is the only compiler
      # available (§3).
      # Split restore from save so the save can run on a failed build. With the
      # combined action the post step is skipped when a step fails, which is
      # exactly backwards: a run that failed to compile is the one whose next
      # attempt most needs a warm cache, and without this every iteration
      # rebuilds vendored Boost and RocksDB from scratch.
      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DACTIVE_NETWORK=banano_dev_network \
            -DNANO_GUI=OFF \
            -DNANO_TEST=ON \
            -DPORTABLE=1 \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # The node executable is `bananode`, not `nano_node` — inherited from
      # Banano (nano/nano_node/CMakeLists.txt). Renaming it to `keinode` is a
      # packaging change (systemd unit, CPack, Docker) and is deliberately not
      # bundled in with the CI setup.
      #
      # -k 0 keeps going after the first failure, so one run reports every
      # error in the tree rather than only the first translation unit's.
      #
      # This target can also fail without anything being wrong with the build:
      # CMake attaches a POST_BUILD step that runs the binary to generate the
      # sample configs, so a node that crashes on startup fails here too, under
      # a printed link command that makes it look like a link error. The second
      # script tells those two apart and gets a backtrace for the second.
      - name: Build node
        run: |
          set -o pipefail
          if ! cmake --build build --target bananode -- -k 0 2>&1 | tee build.log; then
            bash ci/annotate-build-failure.sh build.log
            bash ci/annotate-startup-crash.sh build/bananode
            exit 1
          fi

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Version
        run: ./build/bananode --version

      # "It compiles" is a weaker claim than "it works", and until this step
      # existed it was the only claim this workflow could support.
      - name: Build tests
        id: build_tests
        run: |
          set -o pipefail
          if ! cmake --build build --target core_test -- -k 0 2>&1 | tee test-build.log; then
            bash ci/annotate-build-failure.sh test-build.log
            exit 1
          fi

      # The filter is deliberate: the inherited suite bakes in block hashes and
      # genesis balances that decisions-m2.md §14 changed on purpose, so it is
      # red for reasons that are not regressions. Bringing it back to green is
      # its own job, and pretending otherwise here would only hide this signal.
      # The one mdb_block_store case named individually rather than by wildcard:
      # its neighbours are part of the inherited red above (supported_version_upgrades
      # dies in upgrade_v14_to_v15), but the v23 case guards something CI cannot
      # otherwise see at all — every database here is fresh, and a fresh database
      # is precisely the one that never hits the bug.
      #
      # `asset_frame.*` and `message_deserializer.*` cover the wire framing for
      # variable-length asset blocks. Until this filter named them they were
      # compiled and then skipped, which is how three read paths could disagree
      # about where a block's suffix goes underneath a green tick. The rest of
      # message_deserializer is inherited round-trip coverage that does not
      # touch the genesis balances or block hashes §14 changed, so the whole
      # suite runs rather than the one new case.
      #
      # Know the cost of the allowlist before adding to it: a suite that is not
      # named here does not run, and nothing says so. It is not reported as
      # skipped, it does not appear in the output at all, and a coverage report
      # counts its assertions as present. #54 is what that looks like from the
      # outside — two tests written to stand behind a store-layer correctness
      # fix, merged, and never once executed. So when you add a test file, add
      # its suite here in the same commit, or say in the PR why you did not.
      - name: Run Kei tests
        run: ./build/core_test --gtest_filter='asset_block.*:asset_frame.*:asset_ledger.*:asset_payload.*:asset_id.*:block.kei_hash_domain:block.kei_hash_vectors:genesis_reserve.*:json_response.*:issuance_burn.*:mdb_block_store.a_v23_database_without_the_claim_and_swap_tables_still_opens:message_deserializer.*'

      # The RocksDB suites are gated twice, which is why they slipped: the
      # filter above never names them, and each one opens with a GTEST_SKIP
      # unless TEST_USE_ROCKSDB is set (nano/lib/rocksdbconfig.cpp:32). Removing
      # only one gate changes nothing, so removing one was easy to mistake for
      # having done it. This step removes both.
      #
      # It is a second invocation of the same binary rather than a second matrix
      # job on purpose. RocksDB is compiled and linked into core_test
      # unconditionally (CMakeLists.txt add_subdirectory(submodules/rocksdb)),
      # and the backend is a runtime choice made by nano::make_store reading
      # this variable — so a rocksdb matrix entry would spend ~40 minutes
      # producing a byte-identical core_test and then race the lmdb job for the
      # ccache key above. There is no compile coverage to be had from it.
      #
      # Whole-suite rather than the two clear_* cases: upgrade_v21_v22 and
      # tombstone_count are gated by the same two conditions and have therefore
      # also never run here, and a fresh RocksDB database is the one place the
      # v23→v24 column families for the claim and swap tables get created from
      # scratch.
      # `if` for the same reason the build steps pass `-k 0`: when CI is the
      # only place the tree runs, a job that stops at the first failing step
      # spends forty minutes to report a strict subset of what it already knows.
      # A red lmdb filter should not also cost you the RocksDB answer. This
      # still fails the job when it fails — it only declines to be silenced by
      # the step above it. Conditioned on the build rather than on `always()`,
      # so a run that never produced a `core_test` reports the compile error
      # instead of a confusing "no such file".
      - name: Run the RocksDB store tests
        if: ${{ !cancelled() && steps.build_tests.outcome == 'success' }}
        env:
          TEST_USE_ROCKSDB: 1
        run: ./build/core_test --gtest_filter='rocksdb_block_store.*'

      # `rpc_test` is a separate target, so until this step existed the RPC
      # changes shipped without anything compiling their tests — the shapes in
      # §15 were checked by reading. That is the weakest claim in the tree and
      # this is the cheap half of fixing it.
      - name: Build RPC tests
        run: |
          set -o pipefail
          if ! cmake --build build --target rpc_test -- -k 0 2>&1 | tee rpc-test-build.log; then
            bash ci/annotate-build-failure.sh rpc-test-build.log
            exit 1
          fi

      # And the expensive half: `asset_ledger.*` above drives the five asset
      # operations through `ledger.cpp` and the store directly, and this drives
      # the inherited block types through the same path and then asks a running
      # RPC server for them — so the wire shape is checked against a real chain
      # rather than a constructed response.
      #
      # Filtered to the Kei case for the same reason the core_test filter is:
      # the inherited RPC suite is red on genesis balances §14 changed on
      # purpose, and widening this before that is fixed would bury the signal.
      - name: Run Kei RPC tests
        run: ./build/rpc_test --gtest_filter='rpc.account_history_block_shape:rpc.commit_info_claim_status_contract:rpc.asset_offers_bounds_count_and_pages_each_offer_once:rpc.asset_holders_bounds_count_and_pages_each_holder_once'

      - name: Start a clean dev node and wait for RPC
        env:
          KEI_DATA_PATH: ${{ runner.temp }}/kei-data
          KEI_NODE_LOG: ${{ runner.temp }}/kei-node.log
          KEI_NODE_PID: ${{ runner.temp }}/kei-node.pid
        run: |
          mkdir -p "${KEI_DATA_PATH}"
          cat > "${KEI_DATA_PATH}/config-node.toml" <<'TOML'
          [rpc]
          enable = true
          TOML
          cat > "${KEI_DATA_PATH}/config-rpc.toml" <<'TOML'
          address = "::ffff:127.0.0.1"
          port = 45000
          enable_control = true
          TOML

          ./build/bananode --daemon --data_path "${KEI_DATA_PATH}" > "${KEI_NODE_LOG}" 2>&1 &
          echo $! > "${KEI_NODE_PID}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              --header 'content-type: application/json' \
              --data '{"action":"version"}' \
              http://127.0.0.1:45000 > "${{ runner.temp }}/kei-version.json"; then
              cat "${{ runner.temp }}/kei-version.json"
              exit 0
            fi
            if ! kill -0 "$(cat "${KEI_NODE_PID}")" 2>/dev/null; then
              echo "bananode exited before RPC became ready"
              cat "${KEI_NODE_LOG}"
              exit 1
            fi
            sleep 2
          done
          echo "RPC did not become ready within 120 seconds"
          cat "${KEI_NODE_LOG}"
          exit 1

      - name: Run the exact M2 SDK contract against the node
        env:
          KEI_SDK_DIR: ${{ github.workspace }}/kei-transaction
          KEI_NODE_URL: http://127.0.0.1:45000
        run: bash conformance/run-m2.sh

      # commit_info/claim_status are M4; the pinned SDK revision above carries
      # both their executable coverage and the native commit/claim wire layout.
      # See conformance/README.md.
      - name: Run the exact M4 SDK contract against the node
        env:
          KEI_SDK_DIR: ${{ github.workspace }}/kei-transaction
          KEI_NODE_URL: http://127.0.0.1:45000
        run: bash conformance/run-m4.sh

      # M5's swap blocks. The SDK has run the market over HTTP since M5 landed,
      # but never against a node in CI — the pin predated the file, so nothing
      # here could reach it. The node side is what this gates: a swap_offer that
      # the ledger accepts, a lock only the ledger can enforce, and an accept
      # that moves both legs or neither.
      - name: Run the exact M5 SDK contract against the node
        env:
          KEI_SDK_DIR: ${{ github.workspace }}/kei-transaction
          KEI_NODE_URL: http://127.0.0.1:45000
        run: bash conformance/run-m5.sh

      - name: Stop dev node
        if: always()
        env:
          KEI_NODE_PID: ${{ runner.temp }}/kei-node.pid
        run: |
          if [[ -f "${KEI_NODE_PID}" ]]; then
            kill "$(cat "${KEI_NODE_PID}")" 2>/dev/null || true
          fi

      - name: Upload node conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-node-conformance-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kei-node.log
            ${{ runner.temp }}/kei-version.json
            ${{ runner.temp }}/kei-data/config-node.toml
            ${{ runner.temp }}/kei-data/config-rpc.toml
