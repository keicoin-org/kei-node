name: Build

# The Kei node's own build. Replaces the inherited Banano workflows, which
# built `nanocurrency/nano-node` artifacts and pushed images to the
# `bananocoin` DockerHub namespace — neither of which is this project.
#
# This exists as much for development as for CI: the machine kei-node is
# written on has no working C++ toolchain and no administrator rights, so
# until one exists locally, this workflow is where the node actually compiles.
# See docs/decisions-m2.md §3.

# Every branch, not just master: with no local toolchain this workflow is the
# only place the tree compiles, so a branch that cannot reach it cannot be
# worked on at all.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (gcc, lmdb, dev network)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # Boost is vendored at submodules/boost as the Boost superproject,
          # so this is a large recursive checkout and not an optional one:
          # CMakeLists.txt add_subdirectory()s each Boost library directly.
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      # Vendored Boost and RocksDB dominate the build, and neither changes
      # between runs, so without this every iteration recompiles both from
      # scratch. This is the difference between a ~40 minute loop and a ~5
      # minute one, which matters a great deal when CI is the only compiler
      # available (§3).
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DACTIVE_NETWORK=banano_dev_network \
            -DNANO_GUI=OFF \
            -DNANO_TEST=ON \
            -DPORTABLE=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # The node executable is `bananode`, not `nano_node` — inherited from
      # Banano (nano/nano_node/CMakeLists.txt). Renaming it to `keinode` is a
      # packaging change (systemd unit, CPack, Docker) and is deliberately not
      # bundled in with the CI setup.
      #
      # Diagnostics are re-emitted as workflow `::error` commands so they become
      # check annotations. That puts them on the pull request next to the line
      # that caused them, and it is also the only way to read a failure without
      # downloading the log.
      - name: Build node
        run: |
          set -o pipefail
          if ! cmake --build build --target bananode -- -k 0 2>&1 | tee build.log; then
            grep -E '^[^ ]+:[0-9]+:[0-9]+: (error|fatal error):' build.log \
              | sort -u | head -40 \
              | while IFS= read -r line; do
                  file=$(echo "$line" | cut -d: -f1)
                  lineno=$(echo "$line" | cut -d: -f2)
                  col=$(echo "$line" | cut -d: -f3)
                  msg=$(echo "$line" | cut -d: -f4-)
                  echo "::error file=${file},line=${lineno},col=${col}::${msg}"
                done
            exit 1
          fi

      - name: Version
        run: ./build/bananode --version

      # "It compiles" is a weaker claim than "it works", and until this step
      # existed it was the only claim this workflow could support. The filter is
      # deliberate: the inherited suite has hashes and genesis balances baked in
      # that decisions-m2.md §14 changed on purpose, so it is red for reasons
      # that are not regressions. Bringing it back to green is its own job.
      - name: Build tests
        run: |
          set -o pipefail
          if ! cmake --build build --target core_test -- -k 0 2>&1 | tee test-build.log; then
            grep -E '^[^ ]+:[0-9]+:[0-9]+: (error|fatal error):' test-build.log \
              | sort -u | head -40 \
              | while IFS= read -r line; do
                  file=$(echo "$line" | cut -d: -f1)
                  lineno=$(echo "$line" | cut -d: -f2)
                  col=$(echo "$line" | cut -d: -f3)
                  msg=$(echo "$line" | cut -d: -f4-)
                  echo "::error file=${file},line=${lineno},col=${col}::${msg}"
                done
            exit 1
          fi

      - name: Run Kei tests
        run: |
          ./build/core_test --gtest_filter='asset_block.*:asset_payload.*:asset_id.*:block.kei_hash_domain'
